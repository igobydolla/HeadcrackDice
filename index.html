>{if(!r.isConnected)return;const start=performance.now(),prep=member&&!reduced?520:0,duration=reduced?0:1250+i*260;let last=0,layer=null;const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};if(prep){layer=document.createElement('span');layer.className='hc-charge-layer';layer.innerHTML='<i></i><b></b>';d.appendChild(layer)}function frame(now){if(!r.isConnected)return;const ms=now-start,dir=i===1?-1:1;if(layer){const fade=1-ease((ms-prep)/780);layer.style.opacity=ease(ms/320)*fade;layer.querySelector('i').style.opacity=ease((ms-110)/350)*fade*.88;const sweep=clamp((ms-270)/850);layer.querySelector('b').style.opacity=Math.sin(sweep*Math.PI)*.78;layer.querySelector('b').style.transform='translateX('+(-115+230*ease(sweep))+'%)';if(ms<prep){const q=clamp(ms/prep),w=ease(q),z=Math.sin(q*Math.PI*1.5);d.style.transform='translate('+dir*6*z*w+'px,'+(-8*w)+'px) rotate('+dir*12*z*w+'deg) rotateX('+(-15*w)+'deg)';requestAnimationFrame(frame);return}if(ms>=prep+780){layer.remove();layer=null}}let t=duration?clamp((ms-prep)/duration):1,e=1-Math.pow(1-t,2.8),decay=1-t;if(now-last>65+t*155&&t<.87){show(d,1+Math.floor(Math.random()*6));last=now}d.style.transform='rotateX('+Math.sin(e*19)*27*decay+'deg) rotateY('+Math.cos(e*15)*22*decay+'deg) rotateZ('+Math.sin(e*24)*15*decay+'deg) translateY('+(-Math.abs(Math.sin(e*16))*23*decay)+'px)';if(t<1)requestAnimationFrame(frame);else{show(d,ns[i]);d.style.transform='';d.classList.add('settled');spark(d);setTimeout(()=>d.classList.remove('settled'),900);finished()}}requestAnimationFrame(frame)},reduced?0:i*190)})}}
function hcFounding(){openMenuPage('FOUNDING MEMBERSHIP','<div class="fm-hero"><div class="fm-artbox">'+hcFounderArt()+'</div><div class="eyebrow">The original community</div><div class="menu-title">Be here from the beginning.</div><div class="sub">Become a founding member of Head Crack.</div></div>'+fmPreviewMarkup()+'<div class="eyebrow">Your exclusive collection</div><div class="fm-items"><div class="fm-item"><span class="fm-symbol">'+icon('crown')+'</span><div><strong>Permanent founding status</strong><div class="sub">Be recognized as an original member.</div></div></div><div class="fm-item"><span class="fm-symbol">'+icon('crown')+'</span><div><strong>Exclusive player identity</strong><div class="sub">Metallic username, reflective gold avatar ring and animated founding title.</div></div></div><div class="fm-item"><span class="fm-symbol">'+icon('dice')+'</span><div><strong>Legendary founder dice</strong><div class="sub">Solid gold, obsidian-black pips, animated borders and exclusive rolling effects.</div></div></div></div><div class="fm-purchase"><div class="between"><div><div class="fm-price">$4.99</div><div class="sub">One-time purchase · Pay once. Keep your status.</div></div></div><button class="me-primary fm-gold-cta" disabled>Become a Founding Member</button><div class="sub" style="text-align:center;margin:12px 0">Permanent cosmetics. No subscription. Identical gameplay rules and dice probabilities.<br>Payment is not yet enabled.</div></div>');$('menuBack').onclick=hcEconomicsHome;fmBindPreview()}

function hcMonkey(){let sold=0,phase=0,failed=0,offers=0;openMenuPage('MONKEY ECONOMICS','<div class="me-wrap"><div class="between"><span class="eyebrow">$HCRAC · Monkey Economics</span><button class="me-reset" id="meReset" aria-label="Restart">↻</button></div><div class="me-hero"><div style="font-size:64px">🐒</div><h1>Main goal:<br>Make leaves.</h1><div class="sub" id="meSub">Monkey has unlimited bananas.</div></div><div class="me-money" id="meMoney"><div class="eyebrow">Leaves collected</div><div class="me-total" id="meTotal" aria-live="polite">🍃 0</div><div class="sub" id="meSold">0 bananas sold</div></div><div class="me-inventory"><span style="font-size:30px">🍌</span><div><strong>Banana inventory</strong><div class="sub">Unlimited supply</div></div><span style="margin-left:auto;font-size:30px">∞</span></div><div id="meOffers" class="me-card" hidden><div class="between"><div><strong>Monkeys offering to buy</strong><div class="sub">5 leaves for 1 banana</div></div><strong id="meCount" style="font-size:27px">0</strong></div><button class="me-secondary" id="meAdd">🐒 Monkey offers to buy</button></div><button class="me-primary" id="meSell">Sell banana · +5 🍃</button><div class="me-message" id="meMessage" role="status"></div><div class="me-card me-warning" id="meWarning" hidden><strong>No monkeys are offering to buy.</strong><div class="sub">Monkey has unlimited bananas, but he isn’t making any more leaves.</div></div><div class="me-next" id="meNext" hidden><h2>Unlimited bananas.<br>No new leaves.</h2><div class="sub">Monkey doesn’t have a banana problem.</div><button class="me-secondary" id="meContinue">What does monkey need? →</button></div><div class="me-card me-next" id="meObjective" hidden><div class="eyebrow">Monkey’s real objective</div><h2>Get offers to buy bananas.</h2><div class="sub">Monkey already has the bananas.<br>He needs other monkeys’ leaves.</div></div><div class="sub" style="text-align:center;margin-top:20px">Educational simulation · No real money</div></div>');$('menuBack').onclick=hcEconomicsHome;
const show=(id,v)=>$(id).hidden=!v;
function paint(){$('meTotal').textContent='🍃 '+(sold*5).toLocaleString();$('meSold').textContent=sold+' bananas sold';$('meCount').textContent=offers;show('meOffers',phase===2);show('meWarning',phase===1&&failed>0);show('meNext',phase===1&&failed>=3);show('meObjective',phase===2);$('meSell').disabled=phase===2&&offers===0;$('meSell').textContent=phase===2?'Accept offer · Sell banana for 5 🍃':'Sell banana · +5 🍃';$('meSub').textContent=phase===0?'Monkey has unlimited bananas.':phase===1?'Monkey still has unlimited bananas.':'Monkey knows what he needs.'}
function feedback(ok){const m=$('meMoney'),t=$('meTotal'),msg=$('meMessage');msg.textContent=ok?'+5 leaves collected':'No leaves received.';msg.style.color=ok?'#d9d9d9':'#dfbc85';const el=document.createElement('span');el.className='me-float '+(ok?'':'me-fail');el.textContent=ok?'+5 🍃':'+0 🍃';m.appendChild(el);setTimeout(()=>el.remove(),850);t.classList.remove('me-flash','me-shake');void t.offsetWidth;t.classList.add(ok?'me-flash':'me-shake')}
$('meSell').onclick=()=>{if(phase===1){failed++;feedback(false);paint();return}if(phase===2){if(!offers)return;offers--}sold++;feedback(true);if(phase===0&&sold>=15)phase=1;paint()};$('meAdd').onclick=()=>{offers++;$('meMessage').textContent='New purchase offer received.';$('meMessage').style.color='#d9d9d9';paint()};$('meContinue').onclick=()=>{phase=2;$('meMessage').textContent='';paint()};$('meReset').onclick=()=>{sold=0;phase=0;failed=0;offers=0;$('meMessage').textContent='';$('meMoney').querySelectorAll('.me-float').forEach(e=>e.remove());paint()};paint()}

mainMenu();
const hcInvite=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/^HC-/,'');if(/^[0-9A-F]{10}$/.test(hcInvite)){hcForm('join',hcInvite);const e=hcView;hcRequest('state',0,'',hcInvite).then(r=>{if(e!==hcView||!Number.isInteger(r.selfIndex))return;hcCode=r.code;hcIndex=r.selfIndex;hcState=r;localStorage.setItem('hcLastRoom',r.code);hcRender();hcPoll=setInterval(hcRefresh,1100)}).catch(()=>{})}
